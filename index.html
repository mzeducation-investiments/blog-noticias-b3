<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias Empresariais Brasil - Tempo Real</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #1e3c72;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #e74c3c;
            font-weight: 600;
            font-size: 1.1em;
        }

        .pulse {
            width: 12px;
            height: 12px;
            background: #e74c3c;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #1e3c72;
            background: white;
            color: #1e3c72;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .filter-btn:hover {
            background: #1e3c72;
            color: white;
        }

        .filter-btn.active {
            background: #1e3c72;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #1e3c72;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
        }

        .news-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: slideIn 0.5s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .news-header {
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }

        .news-source {
            font-size: 0.85em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .news-title {
            font-size: 1.3em;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .news-time {
            font-size: 0.85em;
            opacity: 0.8;
        }

        .news-body {
            padding: 20px;
        }

        .news-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .news-link {
            display: inline-block;
            color: #1e3c72;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .news-link:hover {
            color: #2a5298;
        }

        .error-message {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            text-align: center;
        }

        @media (max-width: 768px) {
            .news-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .controls {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Notícias Empresariais Brasil</h1>
            <div class="live-indicator">
                <div class="pulse"></div>
                <span>Atualização Automática</span>
            </div>
        </header>

        <div class="controls">
            <div class="filter-group" id="filterButtons">
                <button class="filter-btn active" data-category="all">Todas</button>
                <button class="filter-btn" data-category="business">Negócios</button>
                <button class="filter-btn" data-category="technology">Tecnologia</button>
                <button class="filter-btn" data-category="finance">Finanças</button>
                <button class="filter-btn" data-category="market">Mercado</button>
            </div>
        </div>

        <div id="newsContainer">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Carregando notícias em tempo real...</p>
            </div>
        </div>
    </div>

    <script>
        let currentCategory = 'all';
        let newsCache = [];
        let updateInterval;

        async function fetchNews() {
            try {
                const queries = [
                    'empresas brasileiras',
                    'mercado financeiro brasil',
                    'bolsa valores b3',
                    'startups brasil',
                    'economia empresas'
                ];
                
                const randomQuery = queries[Math.floor(Math.random() * queries.length)];
                
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1000,
                        messages: [{
                            role: 'user',
                            content: `Busque as 5 notícias mais recentes sobre ${randomQuery}. Retorne APENAS um JSON válido no formato:
[{
  "title": "título da notícia",
  "description": "breve descrição",
  "source": "fonte",
  "url": "link",
  "category": "business/technology/finance/market",
  "timestamp": "timestamp ISO"
}]

IMPORTANTE: Retorne apenas o array JSON, sem texto adicional, sem markdown, sem backticks.`
                        }],
                        tools: [{
                            type: 'web_search_20250305',
                            name: 'web_search'
                        }]
                    })
                });

                const data = await response.json();
                
                let newsText = '';
                if (data.content) {
                    for (const item of data.content) {
                        if (item.type === 'text') {
                            newsText += item.text;
                        }
                    }
                }

                const cleanText = newsText.replace(/```json|```/g, '').trim();
                const newsData = JSON.parse(cleanText);
                
                newsCache = newsData.map(item => ({
                    ...item,
                    id: Date.now() + Math.random()
                }));
                
                renderNews();
            } catch (error) {
                console.error('Erro ao buscar notícias:', error);
                showError();
            }
        }

        function renderNews() {
            const container = document.getElementById('newsContainer');
            
            const filtered = currentCategory === 'all' 
                ? newsCache 
                : newsCache.filter(n => n.category === currentCategory);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="loading">
                        <p>Nenhuma notícia encontrada nesta categoria</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="news-grid">
                    ${filtered.map(news => `
                        <div class="news-card">
                            <div class="news-header">
                                <div class="news-source">📰 ${news.source}</div>
                                <h3 class="news-title">${news.title}</h3>
                                <div class="news-time">🕒 ${formatTime(news.timestamp)}</div>
                            </div>
                            <div class="news-body">
                                <p class="news-description">${news.description}</p>
                                <a href="${news.url}" target="_blank" class="news-link">
                                    Ler notícia completa →
                                </a>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);

            if (minutes < 1) return 'Agora mesmo';
            if (minutes < 60) return `${minutes} min atrás`;
            if (hours < 24) return `${hours}h atrás`;
            
            return date.toLocaleDateString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function showError() {
            const container = document.getElementById('newsContainer');
            container.innerHTML = `
                <div class="error-message">
                    <h3>⚠️ Erro ao carregar notícias</h3>
                    <p>Tentando novamente em alguns instantes...</p>
                </div>
            `;
        }

        document.getElementById('filterButtons').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(btn => 
                    btn.classList.remove('active')
                );
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                renderNews();
            }
        });

        fetchNews();
        updateInterval = setInterval(fetchNews, 300000);
    </script>
</body>
</html>
